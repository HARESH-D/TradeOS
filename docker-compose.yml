services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradeos
      POSTGRES_USER: tradeos
      POSTGRES_PASSWORD: tradeos
    volumes:
      - tradeos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeos -d tradeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tradeos:tradeos@db:5432/tradeos
      JWT_SECRET: ${JWT_SECRET:-tradeos-docker-development-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  tradeos_postgres:
